[package]
name = "cyfs_gateway"
version.workspace = true
edition = "2021"
authors = ["BuckyOS DAO","@waterflier","@lurenpluto","@wugren"]
build = "build.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror.workspace = true
log.workspace = true
url.workspace = true
tokio = { version = "*", features = ["full","tracing"] }
console-subscriber = { version = "*" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
lazy_static.workspace = true
clap.workspace = true
env_logger.workspace = true
bytes.workspace = true
dirs = "*"
once_cell.workspace = true
anyhow.workspace = true
serde_yaml_ng.workspace = true
sfo-result = "0.2.16"
sha2.workspace = true
chrono.workspace = true
async-recursion = "*"
toml.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
sfo-io = "0.1.12"
buckyos-kit.workspace = true
name-client.workspace = true
name-lib.workspace = true
kRPC.workspace = true

cyfs-gateway-lib = { path = "../../components/cyfs-gateway-lib" }
cyfs-gateway-api.workspace = true
cyfs-gateway-app-lib = { path = "../../components/cyfs-gateway-app-lib" }
cyfs-process-chain = { path = "../../components/cyfs-process-chain" }
cyfs-acme = { path = "../../components/cyfs-acme" }
cyfs-sn = { path = "../../components/cyfs-sn" }
cyfs-dns = { path = "../../components/cyfs-dns" }
