http-body-util.workspace = true
http.workspace = true
shlex.workspace = true
sfo-js = { version = "0.1.8" }
rand = "0.9.2"
reqwest.workspace = true
httpdate = "1.0"

[dev-dependencies]
tempfile.workspace = true
hyper = { version = "1.8", features = ["full"] }
hyper-util.workspace = true
http-body-util.workspace = true
hickory-resolver = { version = "0.24", features = ["tokio"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "deflate", "brotli"] }
bns-indexer = { path = "../../components/bns-indexer" }
bns-server = { path = "../../components/bns-server" }
bns-client = { path = "../../components/bns-client" }
sqlx.workspace = true
