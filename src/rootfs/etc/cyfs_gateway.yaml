# cyfs_gateway configuration field reference (ready to run)
# - This file explains all config fields and provides a minimal runnable HTTP service
# - Default binds to 0.0.0.0:80

# includes:            # extra config files or directories (merged in order), paths are relative to this file
#                      # NOTE: use `includes` (new style); `include` is kept for compatibility in some flows
#   - path: extra.yaml
#   - path: configs/

# user_name: "root"    # console login username, optional
# password: "123456"   # console login password, optional (plain text, hashed on login)
# control_port: 13451  # local control server port, optional; binds to 127.0.0.1:<port>

# js_externals:         # external JS commands (optional)
#   geo_block: ./scripts/geo_block.js
#   custom_auth: ./scripts/custom_auth.js

# identity_manager:      # Gateway-wide identity store for ACME, TLS, QUIC, and RTCP identity loading
#   public_root_path: ./identity
#   security_root_path: ./security

# timers:               # periodic process-chain tasks (optional)
#   clean_cache:
#     timeout: 300      # seconds, must be > 0
#     process-chain: |
#       echo "clean cache";
#   metrics_report:
#     timeout: 60
#     process_chain: |
#       echo "report metrics"; # process-chain / process_chain both supported

# device_manager:       # device online-state manager (optional)
#   enabled: true
#   offline_timeout_seconds: 600   # default 600
#   cleanup_interval_seconds: 60   # default 60

# acme:               # ACME certificate config (optional)
#   account: "admin@example.com"  # ACME account
#   issuer: "https://acme-v02.api.letsencrypt.org/directory"  # ACME directory URL
#   dns_providers:     # DNS challenge config
#     aliyun: // Alibaba Cloud
#       accessKeyId: "***"
#       accessKeySecret: "***"
#    sn-dns: // buckyos sn
#      sn: https://sn.buckyos.ai
#      key_path: ***
#      device_config_path: ***
#   hosts:                         # certificates ACME should obtain and maintain
#     - host: example.com
#       challenge_type: dns-01     # dns-01 | http-01 | tls-alpn-01; default tls-alpn-01
#       dns_provider: sn-dns       # required for dns-01
#     - host: "*.example.org"
#       challenge_type: dns-01
#       dns_provider: sn-dns
#   check_interval: 43200          # certificate check interval (seconds), default 12h
#   renew_before_expiry: 604800    # renew ahead of expiry (seconds), default 7d
#   # identity_manager is optional here; defaults to the Gateway-wide identity_manager above

# tls_ca:             # self-signed/CA certificate config (optional)
#   cert_path: ./ca.crt
#   key_path: ./ca.key

# limiter config (optional; empty object disables)
# limiters:
#   global:            # limiter id (from map key)
#     upper_limiter: ***          # upper limiter id (optional)
#     download_speed: "1GB/s"      # download bandwidth (supports KB/s, MB/s, GB/s)
#     upload_speed: "1GB/s"        # upload bandwidth
#     concurrent: 2048             # concurrency

# global collection config (optional; empty object disables)
# collections:
#   memory_set_example:
#     type: memory_set
#   json_set_example:
#     type: json_set
#     file_path: ./data.json
#   sqlite_set_example:
#     type: sqlite_set
#     file_path: ./data.db
#     data:
#       table_name: items
#       column_name: value
#   text_set_example:
#     type: text_set
#     file_path: ./data.txt
#   memory_map_example:
#     type: memory_map
#   json_map_example:
#     type: json_map
#     file_path: ./map.json
#     only_read_file: true        # 可选。启用后 gateway 每次读取都直接访问文件，并禁用内部写入
#   app_info:
#     type: json_map
#     file_path: ./all_info.json#app_info
#     only_read_file: true        # 使用 #json_path 读取文件中的一个子对象；当前仅支持只读模式
#   sqlite_map_example:
#     type: sqlite_map
#     file_path: ./map.db
#     data:
#       table_name: kv
#       key_name: k
#       value_name: v

# global process chain config (optional; empty object disables)
# global_process_chains:
#   global_chain:
#     priority: 1
#     blocks:
#       default:
#         priority: 1
#         block: |
#           echo "hello";

stacks:
  http_tcp:
    # id comes from map key (here: http_tcp)
    protocol: tcp                 # tcp | udp | tls | quic | rtcp | tun
    bind: 0.0.0.0:80            # bind address
    # concurrency: 0              # active connection limit, default 0 (unlimited)
    # transparent: false          # transparent proxy mode (tcp/udp optional, default false)
    # reuse_address: false        # SO_REUSEADDR (optional, default false)
    # io_dump_file: tcp.dump      # enable io dump; relative path resolves to service data dir/dumps/
    # io_dump_rotate_size: 1GB    # rotate size; supports B/KB/MB/GB/TB
    # io_dump_rotate_max_files: 8 # optional, keep at most N rotated files
    # io_dump_max_upload_bytes_per_conn: 1MB   # optional, default 1MB
    # io_dump_max_download_bytes_per_conn: 1MB # optional, default 1MB
    # stream_idle_timeout: 600     # stream forwarding idle timeout (seconds), default 600, same as nginx proxy timeout
    # connect_timeout: 60         # forward target connection timeout (seconds), default 60
    hook_point: # process chains (map form, converted to array)
      main:
        priority: 1000
        blocks:
          default:
            priority: 1
            block: |
              call-server welcome;

